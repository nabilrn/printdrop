name: Relay CI

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'

permissions:
  contents: read

jobs:
  relay:
    name: Relay - Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Verify modules
        working-directory: relay
        run: |
          go mod download
          go mod verify
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Format
        working-directory: relay
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: relay
        run: go vet ./...

      - name: Test with race detector
        working-directory: relay
        run: go test -race ./...
