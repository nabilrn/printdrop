name: Relay CI

on:
  push:
    paths:
      - 'relay/**'
      - 'web/**'
      - '.gitmodules'
      - '.dockerignore'
      - '.github/workflows/relay-ci.yml'
  pull_request:
    paths:
      - 'relay/**'
      - 'web/**'
      - '.gitmodules'
      - '.dockerignore'
      - '.github/workflows/relay-ci.yml'

permissions:
  contents: read

jobs:
  relay:
    name: Relay - Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Format
        working-directory: relay
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: relay
        run: go vet ./...

      - name: Test with race detector
        working-directory: relay
        run: go test -race ./...

      - name: Build deployable relay image
        run: docker build -f relay/Dockerfile -t printdrop-relay:test .

      - name: Smoke deployable relay image
        shell: bash
        run: |
          set -euo pipefail
          container='printdrop-relay-smoke'
          session='0123456789abcdef0123456789abcdef'

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:18080:8080 \
            printdrop-relay:test

          ready=0
          for _ in {1..40}; do
            if body="$(curl --fail --silent http://127.0.0.1:18080/healthz 2>/dev/null)" && [[ "$body" == 'ok' ]]; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" -ne 1 ]]; then
            docker logs "$container"
            exit 1
          fi

          curl --fail --silent --show-error \
            "http://127.0.0.1:18080/s/$session" \
            | grep --fixed-strings 'id="file"'

          curl --fail --silent --show-error --head \
            "http://127.0.0.1:18080/s/$session" \
            | grep --ignore-case '^content-security-policy:'

          curl --fail --silent --show-error --head \
            http://127.0.0.1:18080/app.js \
            | grep --ignore-case '^content-type: text/javascript; charset=utf-8'
